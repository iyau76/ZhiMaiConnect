<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>更新 Android 网页组件</title>
  <style>
    body {
      margin: 0;
      padding: 32px 24px;
      background: #0b1220;
      color: #f1f5f9;
      font:
        18px/1.8 system-ui,
        sans-serif;
    }
    h1 {
      font-size: 24px;
    }
    a {
      color: #93c5fd;
    }
  </style>
  <h1>请更新 Android System WebView</h1>
  <p>知脉需要 111 或更新版本的 Android 网页组件。更新后重新打开知脉即可，已有资料会保留。</p>
  <p>
    可以在手机应用商店搜索「Android System WebView」或「Android 系统
    WebView」并更新。部分手机通过更新 Chrome 提供此组件。
  </p>
  <p>雷电等模拟器也可能预装旧组件，需要在模拟器内更新。</p>
</html>
