name: PR 3 compatibility validation
on:
  push:
    branches: [fix/pr3-date-family-compatibility]
    paths:
      - .github/pr3-compatibility.py
      - .github/workflows/pr3-compatibility.yml
permissions:
  contents: read
jobs:
  repair-and-verify:
    if: github.ref == 'refs/heads/fix/pr3-date-family-compatibility'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Apply reviewed compatibility changes
        run: python .github/pr3-compatibility.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Format only changed files
        run: >-
          npx prettier --write
          .github/workflows/pr3-compatibility.yml
          src/components/calendar-panel.tsx
          src/components/relations-panel.tsx
          src/lib/family-tree-layout.ts
          src/lib/archive-mutation-plan.ts
          src/lib/pr3-compatibility.test.ts
          e2e/event-month-precision.spec.ts
          e2e/pr3-compatibility.spec.ts
      - name: Commit repair on the isolated branch
        id: repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr3-compatibility.yml src/components/calendar-panel.tsx src/components/relations-panel.tsx src/lib/family-tree-layout.ts src/lib/archive-mutation-plan.ts src/lib/pr3-compatibility.test.ts e2e/event-month-precision.spec.ts e2e/pr3-compatibility.spec.ts
          git commit -m 'fix: preserve legacy event dates and family-tree interactions'
          git push origin HEAD:fix/pr3-date-family-compatibility
          mkdir -p test-results/compatibility
          git rev-parse HEAD | tee test-results/compatibility/revision.txt
          git diff adb16d44194a624654ba98f2cc751daf85137f7c HEAD -- src e2e > test-results/compatibility/repair.patch
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Typecheck, lint, formatting and unit tests
        if: ${{ always() && steps.repair.outputs.sha != '' }}
        run: npm run check 2>&1 | tee test-results/compatibility/check.log
      - name: Production build
        if: ${{ always() && steps.repair.outputs.sha != '' }}
        run: npm run build 2>&1 | tee test-results/compatibility/build.log
      - name: Install Chromium
        if: ${{ always() && steps.repair.outputs.sha != '' }}
        run: npx playwright install --with-deps chromium
      - name: Browser regression suite
        if: ${{ always() && steps.repair.outputs.sha != '' }}
        run: npm run e2e 2>&1 | tee test-results/compatibility/e2e.log
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr3-compatibility-results
          path: |
            test-results/compatibility
            test-results/playwright
            playwright-report
          if-no-files-found: warn
