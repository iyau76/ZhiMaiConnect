name: Apply verified PR7 patch
on:
  push:
    branches: [fix/pr7-reviewed-data-integrity]
    paths:
      - .github/workflows/pr7-apply-reviewed.yml
      - .github/pr7-reviewed.part*
permissions:
  contents: read
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/pr7-reviewed-data-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply locally tested patch
        run: |
          cat .github/pr7-reviewed.part0 .github/pr7-reviewed.part1 .github/pr7-reviewed.part2 > /tmp/pr7.patch.xz
          echo '06d2f683ba08298e3dfab1b0d49a740aa47aead5cccb1fc3bf3afefccd751741  /tmp/pr7.patch.xz' | sha256sum -c -
          xz -dc /tmp/pr7.patch.xz > /tmp/pr7.patch
          echo '8a23f46c561c07c4a6172bb5433f8687430007e5a6d6147e365b819e1592c151  /tmp/pr7.patch' | sha256sum -c -
          git apply --check /tmp/pr7.patch
          git apply /tmp/pr7.patch
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src e2e doc
          git diff --cached --stat
          git commit -m 'fix: enforce transactional event saves and dependency-safe intake undo'
          git push origin HEAD:fix/pr7-reviewed-data-integrity
          git rev-parse HEAD
